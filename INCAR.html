<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VASP INCAR 参数中文参考手册</title>
<meta name="description" content="VASP INCAR 参数中文参考手册：607 个参数的中文说明、默认值、推荐设置与常用计算模板。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf6f0;--surface:rgba(255,255,255,.72);--surface2:rgba(255,252,245,.8);--surface3:rgba(201,168,76,.06);
  --border:rgba(201,168,76,.15);--accent:#b8860b;--accent-dim:rgba(184,134,11,.08);
  --accent-glow:rgba(184,134,11,.18);--text:#3d3428;--text-muted:#8a7e6e;
  --text-code:#7a6540;--success:#22c55e;--tag-bg:rgba(184,134,11,.06);
  --radius:10px;--sidebar-w:280px;
}
html{scroll-behavior:smooth;font-size:15px}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:var(--text);
  min-height:100vh;overflow-x:hidden;line-height:1.7;
  background:linear-gradient(135deg,#faf6f0 0%,#f5efe5 30%,#f8f3ec 60%,#f6f0e8 100%);
}
::selection{background:rgba(184,134,11,.2);color:var(--text)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(184,134,11,.2);border-radius:3px}

/* ---- Sidebar ---- */
.sidebar{
  position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-right:1px solid rgba(184,134,11,.1);
  display:flex;flex-direction:column;z-index:100;transition:transform .3s ease;
}
.sidebar-header{
  padding:28px 24px 20px;border-bottom:1px solid var(--border);
}
.sidebar-header h1{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:1.15rem;font-weight:700;
  color:var(--accent);letter-spacing:.02em;line-height:1.3;
}
.sidebar-header p{
  font-size:.75rem;color:var(--text-muted);margin-top:6px;
}
.sidebar-nav{
  flex:1;overflow-y:auto;padding:12px 0;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 24px;
  cursor:pointer;font-size:.85rem;color:var(--text-muted);
  transition:all .2s ease;border-left:3px solid transparent;
}
.nav-item:hover{color:var(--text);background:var(--accent-dim)}
.nav-item.active{
  color:var(--accent);border-left-color:var(--accent);
  background:var(--accent-dim);font-weight:500;
}
.nav-item .icon{font-size:1rem;width:22px;text-align:center}
.nav-item .count{
  margin-left:auto;font-size:.7rem;background:var(--surface3);
  padding:2px 8px;border-radius:10px;color:var(--text-muted);
}
.sidebar-footer{
  padding:16px 24px;border-top:1px solid var(--border);
  font-size:.7rem;color:var(--text-muted);
}

/* ---- Main ---- */
.main{
  margin-left:var(--sidebar-w);padding:0 40px 80px;position:relative;z-index:1;
}
.top-bar{
  position:sticky;top:0;z-index:50;padding:20px 0;
  background:linear-gradient(rgba(250,246,240,.9) 60%,transparent);
  backdrop-filter:blur(12px);
}
.search-wrap{
  display:flex;align-items:center;gap:12px;
}
.search-box{
  flex:1;max-width:560px;position:relative;
}
.search-box input{
  width:100%;padding:12px 18px 12px 44px;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(184,134,11,.12);
  border-radius:var(--radius);color:var(--text);font-size:.9rem;
  font-family:inherit;outline:none;transition:border-color .2s;
}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--text-muted)}
.search-box::before{
  content:'⌕';position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:1.1rem;color:var(--text-muted);
}
.result-count{
  font-size:.8rem;color:var(--text-muted);white-space:nowrap;
}

/* ---- Templates ---- */
.templates-section{
  margin:20px 0 32px;
}
.templates-section h2{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:1rem;font-weight:600;
  color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.template-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;
}
.tpl-card{
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(184,134,11,.1);
  border-radius:var(--radius);padding:14px 16px;cursor:pointer;
  transition:all .25s ease;position:relative;overflow:hidden;
}
.tpl-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--accent);opacity:0;transition:opacity .25s;
}
.tpl-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.tpl-card:hover::before{opacity:1}
.tpl-card h3{font-size:.85rem;font-weight:600;margin-bottom:4px}
.tpl-card p{font-size:.75rem;color:var(--text-muted);line-height:1.4}
.tpl-card .tag{
  display:inline-block;margin-top:8px;font-size:.65rem;
  background:var(--accent-dim);color:var(--accent);
  padding:2px 8px;border-radius:4px;
}

/* ---- Param Cards ---- */
.section-title{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:1.2rem;font-weight:700;
  color:var(--text);margin:36px 0 8px;padding-bottom:10px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
}
.section-desc{
  font-size:.8rem;color:var(--text-muted);margin-bottom:16px;
}
.param-grid{
  display:flex;flex-direction:column;gap:10px;
}
.param-card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(184,134,11,.1);
  border-radius:var(--radius);overflow:hidden;
  transition:all .25s ease;
}
.param-card:hover{border-color:rgba(201,168,76,.3)}
.param-head{
  display:flex;align-items:center;padding:14px 18px;cursor:pointer;
  gap:14px;transition:background .15s;
}
.param-head:hover{background:var(--surface2)}
.param-name{
  font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;font-size:1.08rem;font-weight:500;
  color:var(--accent);min-width:140px;
}
.param-brief{
  flex:1;font-size:.92rem;color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.param-default{
  font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;font-size:.85rem;
  color:var(--text-code);background:var(--tag-bg);
  padding:3px 10px;border-radius:4px;white-space:nowrap;
}
.param-arrow{
  font-size:.8rem;color:var(--text-muted);transition:transform .25s;
  width:20px;text-align:center;
}
.param-card.open .param-arrow{transform:rotate(90deg)}
.param-body{
  max-height:0;overflow:hidden;transition:max-height .35s ease;
}
.param-card.open .param-body{max-height:600px}
.param-detail{
  padding:0 18px 18px;border-top:1px solid var(--border);
}
.detail-row{
  display:grid;grid-template-columns:90px 1fr;gap:8px;
  padding:10px 0;font-size:.9rem;
  border-bottom:1px solid rgba(184,134,11,.08);
}
.detail-row:last-child{border-bottom:none}
.detail-label{
  color:var(--accent);font-weight:500;font-size:.85rem;
  padding-top:2px;
}
.detail-value{color:var(--text);line-height:1.6}
.detail-value code{
  font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;font-size:.88rem;
  background:var(--tag-bg);padding:1px 6px;border-radius:3px;
  color:var(--text-code);
}
.wiki-link{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  font-size:.85rem;color:var(--accent);text-decoration:none;
  padding:4px 12px;border:1px solid var(--border);border-radius:6px;
  transition:all .2s;
}
.wiki-link:hover{border-color:var(--accent);background:var(--accent-dim)}
.wiki-tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.8rem;font-weight:600;color:#b8860b;text-decoration:none;
  padding:2px 10px;border:1px solid rgba(184,134,11,.2);border-radius:12px;
  background:rgba(184,134,11,.06);transition:all .2s;white-space:nowrap;
}
.wiki-tag:hover{border-color:rgba(184,134,11,.4);background:rgba(184,134,11,.12);color:#9a7209}

/* ---- Template Modal ---- */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(61,52,40,.3);
  z-index:200;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
.modal-overlay.show{display:flex}
.modal{
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid rgba(184,134,11,.12);
  border-radius:14px;max-width:520px;width:90%;max-height:80vh;
  overflow-y:auto;padding:28px;
}
.modal h2{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:1.1rem;font-weight:700;
  color:var(--accent);margin-bottom:6px;
}
.modal p{font-size:.82rem;color:var(--text-muted);margin-bottom:16px}
.modal pre{
  background:rgba(184,134,11,.04);border:1px solid rgba(184,134,11,.1);
  border-radius:8px;padding:16px;font-size:.8rem;
  font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;color:var(--text-code);
  line-height:1.8;overflow-x:auto;white-space:pre;
}
.modal-actions{
  display:flex;gap:10px;margin-top:16px;justify-content:flex-end;
}
.btn{
  padding:8px 18px;border-radius:6px;font-size:.8rem;
  font-family:inherit;cursor:pointer;border:1px solid rgba(184,134,11,.15);
  background:rgba(255,255,255,.6);color:var(--text);transition:all .2s;
}
.btn:hover{border-color:var(--accent)}
.btn-primary{
  background:var(--accent);color:#fff;border-color:var(--accent);
  font-weight:600;
}
.btn-primary:hover{opacity:.85}

/* ---- Back to Home Button ---- */
.back-home{
  position:fixed;bottom:30px;right:30px;z-index:200;
  display:none;align-items:center;gap:8px;
  padding:12px 20px;border-radius:24px;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--accent);border:1px solid rgba(184,134,11,.15);
  font-size:.85rem;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  cursor:pointer;box-shadow:0 4px 20px rgba(184,134,11,.1);
  transition:all .25s ease;
}
.back-home:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(184,134,11,.15)}
.back-home.show{display:flex}

/* ---- Mobile ---- */
.menu-toggle{
  display:none;position:fixed;top:16px;left:16px;z-index:150;
  width:40px;height:40px;
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(184,134,11,.12);border-radius:8px;
  color:var(--accent);font-size:1.2rem;cursor:pointer;
}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex;align-items:center;justify-content:center}
  .main{margin-left:0;padding:20px 16px 60px}
  .top-bar{padding-top:56px}
  .template-grid{grid-template-columns:1fr}
}

/* ---- Animations ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.param-card{animation:fadeUp .4s ease both}
.param-card:nth-child(2){animation-delay:.04s}
.param-card:nth-child(3){animation-delay:.08s}
.param-card:nth-child(4){animation-delay:.12s}
.param-card:nth-child(5){animation-delay:.16s}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="展开导航菜单">☰</button>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>VASP INCAR<br>参数参考手册</h1>
    <p>中文版 · 2026-04-30 17:40 生成</p>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    数据来源: <a href="https://www.vasp.at/wiki/" target="_blank" style="color:var(--accent)">VASP Wiki</a><br>
    翻译: MiMo API · 小米大模型<br>
    编写: <span style="color:var(--accent)">@Leejero</span>
  </div>
</aside>

<main class="main">
  <div class="top-bar">
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索参数名或描述… (如 ENCUT, 截断能量, 杂化)">
      </div>
      <span class="result-count" id="resultCount"></span>
    </div>
  </div>

  <div id="disclaimer" style="background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(184,134,11,.1);border-radius:var(--radius);padding:40px 40px;margin-bottom:32px;font-size:1.3rem;color:var(--text-muted);line-height:2;">
    <strong style="color:var(--accent);font-size:1.5rem">📌 声明</strong><br><br>
    本页面中的参数翻译与推荐建议由 AI 参考官网自动生成，仅供学习参考，不构成任何官方指导。<br>
    各参数的详细说明请以 <a href="https://www.vasp.at/wiki/" target="_blank" style="color:var(--accent);text-decoration:underline;font-weight:600">VASP Wiki 官网</a> 为准。<br>
    点击参数卡片上的 <span style="color:var(--accent);font-weight:600">Wiki</span> 标签可快速跳转至对应参数的官方页面，获取最权威的信息。<br><br>
    <span style="color:var(--text-muted);font-size:1rem">💡 请从左侧导航栏选择「全部参数」或具体字母分类开始浏览。</span>
  </div>

  <section class="templates-section" id="tplSection">
    <h2>⚡ 常用计算模板</h2>
    <div class="template-grid" id="tplGrid"></div>
  </section>

  <div id="paramContent"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <p id="modalDesc"></p>
    <pre id="modalCode"></pre>
    <div class="modal-actions">
      <button class="btn" id="modalCloseBtn">关闭</button>
      <button class="btn btn-primary" id="modalCopyBtn">复制 INCAR</button>
    </div>
  </div>
</div>

<button class="back-home" id="backHome">← 回到主页</button>

<script>
let CATEGORIES = {};
let PARAMS = {};
let TEMPLATES = [];

async function loadData() {
  const container = document.getElementById('paramContent');
  container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0">⏳ 正在加载参数数据…</p>';
  try {
    const r = await fetch('data/incar-data.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    CATEGORIES = d.categories || {};
    PARAMS = d.params || {};
    TEMPLATES = d.templates || [];
    container.innerHTML = '';
    renderSidebar();
    renderTemplates();
    renderContent();
  } catch (e) {
    container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0">❌ 参数数据加载失败：' + esc(e.message) + '（请刷新重试）</p>';
  }
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let activeCategory = 'home';
let currentIncar = '';

// ---- Sidebar ----
function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let html = `<div class="nav-item active" data-cat="all">
    <span class="icon">📋</span><span>全部参数</span>
    <span class="count">${Object.keys(PARAMS).length}</span>
  </div>`;
  for (const [name, cat] of Object.entries(CATEGORIES)) {
    html += `<div class="nav-item" data-cat="${esc(name)}">
      <span class="icon">${esc(cat.icon)}</span><span>${esc(name)}</span>
      <span class="count">${cat.params.length}</span>
    </div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => {
      nav.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      activeCategory = el.dataset.cat;
      document.querySelector('.sidebar').classList.remove('open');
      document.getElementById('searchInput').value = '';
      renderContent();
    });
  });
}

// ---- Templates ----
function renderTemplates() {
  const grid = document.getElementById('tplGrid');
  grid.innerHTML = TEMPLATES.map((t, i) => `
    <div class="tpl-card" data-idx="${i}">
      <h3>${esc(t.name)}</h3>
      <p>${esc(t.desc)}</p>
      <span class="tag">${Object.keys(t.params).length} 个参数</span>
    </div>
  `).join('');
}

function showTemplate(i) {
  const t = TEMPLATES[i];
  document.getElementById('modalTitle').textContent = t.name;
  document.getElementById('modalDesc').textContent = t.desc;
  let code = '# ' + t.name + '\n# ' + t.desc + '\n\n';
  for (const [k, v] of Object.entries(t.params)) {
    code += ` ${k} = ${v}\n`;
  }
  document.getElementById('modalCode').textContent = code;
  currentIncar = code;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function copyIncar() {
  navigator.clipboard.writeText(currentIncar).then(() => {
    const btn = document.querySelector('.btn-primary');
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制 INCAR', 1500);
  });
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ---- Param Cards ----
function renderContent() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const container = document.getElementById('paramContent');
  const disclaimer = document.getElementById('disclaimer');
  const tplSection = document.getElementById('tplSection');
  const backBtn = document.getElementById('backHome');
  let html = '';
  let totalCount = 0;

  // Home mode: only show disclaimer + templates
  if (activeCategory === 'home' && !query) {
    disclaimer.style.display = '';
    tplSection.style.display = '';
    container.innerHTML = '';
    backBtn.classList.remove('show');
    return;
  }

  // Not on home: hide disclaimer/templates, show back button
  disclaimer.style.display = 'none';
  tplSection.style.display = 'none';
  backBtn.classList.add('show');

  const cats = activeCategory === 'all' ? Object.entries(CATEGORIES) :
    Object.entries(CATEGORIES).filter(([k]) => k === activeCategory);

  for (const [catName, catInfo] of cats) {
    const filtered = catInfo.params.filter(p => {
      const data = PARAMS[p];
      if (!data) return false;
      if (!query) return true;
      // 匹配参数名或中文描述（不区分大小写）
      return p.toLowerCase().includes(query) ||
        (data.description_cn||'').toLowerCase().includes(query);
    });

    if (filtered.length === 0) continue;
    totalCount += filtered.length;

    html += `<h3 class="section-title">
      <span style="color:${esc(catInfo.color)}">${esc(catInfo.icon)}</span> ${esc(catName)}
      <span style="font-size:.75rem;color:var(--text-muted);font-weight:400">(${filtered.length})</span>
    </h3>
    <p class="section-desc">${esc(catInfo.desc)}</p>
    <div class="param-grid">`;

    for (const p of filtered) {
      const d = PARAMS[p] || {};
      html += `<div class="param-card">
        <div class="param-head">
          <span class="param-name">${esc(p)}</span>
          <span class="param-brief">${esc(d.description_cn || d.description || '')}</span>
          ${d.wiki_url ? `<a class="wiki-tag" href="${esc(d.wiki_url)}" target="_blank" rel="noopener noreferrer" title="VASP Wiki">Wiki</a>` : ''}
          <span class="param-default">${esc(d.default_value || d.default || '?')}</span>
          <span class="param-arrow">▶</span>
        </div>
        <div class="param-body"><div class="param-detail">
          <div class="detail-row"><span class="detail-label">描述</span><span class="detail-value">${esc(d.description_cn || d.description || '暂无')}</span></div>
          <div class="detail-row"><span class="detail-label">默认值</span><span class="detail-value"><code>${esc(d.default_value || d.default || '请查阅 Wiki')}</code></span></div>
          ${d.details_cn ? `<div class="detail-row"><span class="detail-label">详细说明</span><span class="detail-value">${esc(d.details_cn)}</span></div>` : ''}
          <div class="detail-row"><span class="detail-label">推荐</span><span class="detail-value">${esc(d.recommended || '请参考 VASP Wiki')}</span></div>
          <div class="detail-row"><span class="detail-label">注意事项</span><span class="detail-value">${esc(d.tips || '建议做收敛性测试')}</span></div>
          ${d.wiki_url ? `<a class="wiki-link" href="${esc(d.wiki_url)}" target="_blank" rel="noopener noreferrer">📖 查看 VASP Wiki 原文</a>` : ''}
        </div></div>
      </div>`;
    }
    html += '</div>';
  }

  if (!html) {
    html = '<p style="text-align:center;color:var(--text-muted);padding:60px 0">未找到匹配的参数</p>';
  }

  container.innerHTML = html;
  document.getElementById('resultCount').textContent = query ? `找到 ${totalCount} 个参数` : '';
}

// ---- Search (防抖 200ms) ----
let _searchDebounce = null;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(applySearch, 200);
});
function applySearch() {
  if (activeCategory !== 'all') {
    activeCategory = 'all';
    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.cat === 'all');
    });
  }
  const q = document.getElementById('searchInput').value.trim();
  document.getElementById('tplSection').style.display = q ? 'none' : '';
  document.getElementById('disclaimer').style.display = q ? 'none' : '';
  renderContent();
}

// ---- Back to Home ----
function goHome() {
  activeCategory = 'home';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.remove('active');
  });
  renderContent();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ---- Keyboard ----
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// ---- 事件委托与静态按钮绑定 ----
document.getElementById('menuToggle').addEventListener('click', () => {
  document.querySelector('.sidebar').classList.toggle('open');
});
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('modalCopyBtn').addEventListener('click', copyIncar);
document.getElementById('backHome').addEventListener('click', goHome);
document.getElementById('tplGrid').addEventListener('click', e => {
  const card = e.target.closest('.tpl-card');
  if (card) showTemplate(parseInt(card.dataset.idx, 10));
});
document.getElementById('paramContent').addEventListener('click', e => {
  if (e.target.closest('.wiki-tag, .wiki-link')) return; // 链接默认跳转
  const card = e.target.closest('.param-card');
  if (card) card.classList.toggle('open');
});

// ---- Init ----
loadData();
</script>
</body>
</html>
