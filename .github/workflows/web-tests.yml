# 网页端探针（Playwright）
# 说明：
#   · 数据文件由集群 cron 每 20 分钟推送一次（data/**），必须 paths-ignore ——
#     否则每天会触发 70+ 次无意义的 CI 运行。
#   · 探针需要浏览器，故在 CI 内安装 chromium；本地直接 npm test 亦可。
name: web-tests

on:
  push:
    paths-ignore:
      - 'data/**'
      - 'download/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'data/**'
      - 'download/**'
      - '**.md'
  workflow_dispatch:
  # 每天 18:30 UTC（北京时间 02:30）跑全集（含 30 秒真等待的慢探针）
  schedule:
    - cron: '30 18 * * *'

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 安装 chromium
        run: npx playwright install --with-deps chromium

      # ⚠ CI 是 2 核机器、无 GPU，探针比本地慢 2~3 倍（本地全集约 11 分钟）：
      #   实测全集在 25 分钟超时内跑不完。故 push/PR 只跑快集（约 10~12 分钟），
      #   全集（含 probe_applog 的 30 秒真·自动收起、probe_nav_reach 的多档窗口逐项点击）
      #   放到定时任务与手动触发。
      - name: 运行探针（快集）
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm test -- --fast

      - name: 运行探针（全集）
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: npm test

      - name: 失败时保留现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-screens
          path: tests/.tmp/
          if-no-files-found: ignore
          retention-days: 7
