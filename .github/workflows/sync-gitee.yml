name: Sync to Gitee

on:
  push:
    branches: [main]
  # 也支持手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码（固定到 v4.2.2 的完整 commit SHA，防止 tag 被恶意移动的供应链攻击）
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # 2. 配置 SSH 密钥
      #    - 私钥通过 env 传递并用 printf 写入，避免直接内插进 shell 脚本
      #    - known_hosts 使用固定的 gitee.com 公钥指纹，防止 ssh-keyscan 遭中间人攻击
      - name: Setup SSH
        env:
          GITEE_KEY: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GITEE_KEY" > ~/.ssh/gitee_sync_key
          chmod 600 ~/.ssh/gitee_sync_key
          cat >> ~/.ssh/known_hosts <<'EOF'
          gitee.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKxHSJ7084RmkJ4YdEi5tngynE8aZe2uEoVVsB/OvYN
          gitee.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMuEoYdx6to5oxR60IWj8uoe1aI0X1fKOHWOtLqTg1tsLT1iFwXV5JmFjU46EzeMBV/6EmI1uaRI6HiEPtPtJHE=
          gitee.com ssh-rsa 
          EOF

      # 3. 推送到 Gitee
      - name: Push to Gitee
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/gitee_sync_key -o StrictHostKeyChecking=yes"
        run: |
          git remote add gitee git@gitee.com:Leejero/date.git || true
          git push gitee main --force
